<!DOCTYPE html>
<html>
  <head>
    <title>Family To-Do List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      * { box-sizing: border-box; }

      body {
        background-image: url('background.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: Arial, sans-serif;
        padding: 20px;
        min-height: 100vh;
      }

      h1 {
        color: #2c3e7a;
        text-align: center;
        margin-bottom: 16px;
        font-size: 22px;
      }

      .tabs {
        display: flex;
        gap: 6px;
        justify-content: center;
        margin-bottom: 16px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .tab {
        padding: 8px 12px;
        border-radius: 20px;
        border: 2px solid #2c3e7a;
        background: white;
        color: #2c3e7a;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .tab.active {
        background: #2c3e7a;
        color: white;
      }

      .card {
        max-width: 500px;
        margin: 0 auto;
        background-color: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      }

      .input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      input[type="text"] {
        flex: 1;
        padding: 10px 14px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
      }

      input[type="date"] {
        width: 100%;
        padding: 8px 12px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 10px;
        color: #444;
      }

      button {
        padding: 10px 18px;
        background-color: #2c3e7a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover { background-color: #1a2a5e; }

      .emoji-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .emoji-btn {
        background: #f0f4ff;
        border: 2px solid transparent;
        border-radius: 8px;
        font-size: 20px;
        padding: 4px 8px;
        cursor: pointer;
      }

      .emoji-btn.selected {
        border-color: #2c3e7a;
        background: #e0e8ff;
      }

      ul { list-style: none; padding: 0; margin: 0; }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
        gap: 10px;
      }

      li.done .task-text {
        text-decoration: line-through;
        color: #aaa;
      }

      li.done .due-date { color: #ccc; }

      .task-left {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        flex: 1;
      }

      .task-info { display: flex; flex-direction: column; }
      .task-text { font-size: 15px; color: #222; }

      .due-date {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }

      .due-date.overdue { color: #cc3333; font-weight: bold; }
      .task-emoji { font-size: 20px; }

      .delete-btn {
        background: none;
        color: #cc3333;
        font-size: 18px;
        padding: 0 8px;
      }

      .delete-btn:hover { background: none; color: #991111; }

      .empty {
        text-align: center;
        color: #aaa;
        font-size: 14px;
        padding: 24px 0;
      }

      .syncing {
        text-align: center;
        font-size: 12px;
        color: #888;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1>👨‍👩‍👧‍👦 Family To-Do List</h1>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('Loti', this)">Loti</button>
      <button class="tab" onclick="switchTab('Asline', this)">Asline</button>
      <button class="tab" onclick="switchTab('Hanah', this)">Hanah</button>
      <button class="tab" onclick="switchTab('Elizabeth', this)">Elizabeth</button>
      <button class="tab" onclick="switchTab('Melchi', this)">Melchi</button>
    </div>

    <div class="card">
      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button onclick="addTask()">Add</button>
      </div>
      <input type="date" id="dueDateInput">
      <div class="emoji-row">
        <button class="emoji-btn" onclick="selectEmoji(this)">📞</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">🏥</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">🏠</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">💼</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">🛒</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">📚</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">💪</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">✈️</button>
      </div>
      <ul id="taskList"></ul>
      <div class="empty" id="emptyMsg" style="display:none">No tasks yet — add one above!</div>
      <div class="syncing" id="syncMsg"></div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDGW3cYbZxFkrEcSoS4DGGFfYn98ZHWkY8",
        authDomain: "family-todo-1e7c8.firebaseapp.com",
        projectId: "family-todo-1e7c8",
        storageBucket: "family-todo-1e7c8.firebasestorage.app",
        messagingSenderId: "111686009018",
        appId: "1:111686009018:web:096d2d837641ee8ed68283"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      let currentMember = "Loti";
      let selectedEmoji = "";
      let unsubscribe = null;

      function selectEmoji(btn) {
        document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
        if (selectedEmoji === btn.textContent) {
          selectedEmoji = "";
        } else {
          btn.classList.add("selected");
          selectedEmoji = btn.textContent;
        }
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        const [y, m, d] = dateStr.split("-");
        return `Due: ${m}/${d}/${y}`;
      }

      function isOverdue(dateStr) {
        if (!dateStr) return false;
        return new Date(dateStr) < new Date(new Date().toDateString());
      }

      function renderList(tasks) {
        const ul = document.getElementById("taskList");
        const empty = document.getElementById("emptyMsg");
        ul.innerHTML = "";

        if (tasks.length === 0) {
          empty.style.display = "block";
          return;
        }

        empty.style.display = "none";
        tasks.forEach(t => renderTask(t));
      }

      function renderTask(t) {
        const ul = document.getElementById("taskList");
        const li = document.createElement("li");
        if (t.done) li.classList.add("done");

        const left = document.createElement("div");
        left.className = "task-left";
        left.onclick = async function() {
          await updateDoc(doc(db, "tasks", t.id), { done: !t.done });
        };

        if (t.emoji) {
          const emojiSpan = document.createElement("span");
          emojiSpan.className = "task-emoji";
          emojiSpan.textContent = t.emoji;
          left.appendChild(emojiSpan);
        }

        const info = document.createElement("div");
        info.className = "task-info";

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = t.text;
        info.appendChild(span);

        if (t.date) {
          const dateSpan = document.createElement("span");
          dateSpan.className = "due-date" + (isOverdue(t.date) && !t.done ? " overdue" : "");
          dateSpan.textContent = formatDate(t.date);
          info.appendChild(dateSpan);
        }

        left.appendChild(info);

        const del = document.createElement("button");
        del.textContent = "✕";
        del.className = "delete-btn";
        del.onclick = async function() {
          await deleteDoc(doc(db, "tasks", t.id));
        };

        li.appendChild(left);
        li.appendChild(del);
        ul.appendChild(li);
      }

      function listenToTasks() {
        if (unsubscribe) unsubscribe();
        document.getElementById("syncMsg").textContent = "Syncing...";

        const q = query(
          collection(db, "tasks"),
          orderBy("createdAt", "asc")
        );

        unsubscribe = onSnapshot(q, snapshot => {
          const tasks = snapshot.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .filter(t => t.member === currentMember);
          renderList(tasks);
          document.getElementById("syncMsg").textContent = "✓ Synced";
          setTimeout(() => document.getElementById("syncMsg").textContent = "", 2000);
        });
      }

      window.switchTab = function(name, btn) {
        currentMember = name;
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        selectedEmoji = "";
        document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
        listenToTasks();
      };

      window.selectEmoji = selectEmoji;

      window.addTask = async function() {
        const input = document.getElementById("taskInput");
        const dateInput = document.getElementById("dueDateInput");
        const text = input.value.trim();
        if (text === "") return;

        await addDoc(collection(db, "tasks"), {
          member: currentMember,
          emoji: selectedEmoji,
          text,
          done: false,
          date: dateInput.value,
          createdAt: Date.now()
        });

        input.value = "";
        dateInput.value = "";
        selectedEmoji = "";
        document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
        input.focus();
      };

      document.getElementById("taskInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") window.addTask();
      });

      listenToTasks();
    </script>
  </body>
</html>

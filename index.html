<!DOCTYPE html>
<html>
  <head>
    <title>Loti's To-Do List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        background-color: #f0f4ff;
        font-family: Arial, sans-serif;
        padding: 40px;
        min-height: 100vh;
        box-sizing: border-box;
      }

      .card {
        max-width: 500px;
        margin: 0 auto;
        background-color: white;
        border-radius: 12px;
        padding: 40px;
      }

      h1 { color: #2c3e7a; margin-top: 0; }

      .input-row {
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }

      input {
        flex: 1;
        padding: 10px 14px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
      }

      button {
        padding: 10px 18px;
        background-color: #2c3e7a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover { background-color: #1a2a5e; }

      .emoji-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }

      .emoji-btn {
        background: #f0f4ff;
        border: 2px solid transparent;
        border-radius: 8px;
        font-size: 22px;
        padding: 4px 8px;
        cursor: pointer;
        transition: border-color 0.15s;
      }

      .emoji-btn:hover { background: #e0e8ff; }

      .emoji-btn.selected {
        border-color: #2c3e7a;
        background: #e0e8ff;
      }

      ul { list-style: none; padding: 0; margin: 0; }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
        font-size: 15px;
        gap: 10px;
      }

      li.done .task-text {
        text-decoration: line-through;
        color: #aaa;
      }

      .task-left {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        flex: 1;
      }

      .task-emoji { font-size: 20px; }

      .delete-btn {
        background: none;
        color: #cc3333;
        font-size: 18px;
        padding: 0 8px;
      }

      .delete-btn:hover { background: none; color: #991111; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>My To-Do List</h1>
      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button onclick="addTask()">Add</button>
      </div>

      <div class="emoji-row">
        <button class="emoji-btn" onclick="selectEmoji(this)">📞</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">🏥</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">🏠</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">💼</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">🛒</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">📚</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">💪</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">✈️</button>
      </div>

      <ul id="taskList"></ul>
    </div>

    <script>
  let selectedEmoji = "";
  let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

  function saveTasks() {
    const items = document.querySelectorAll("li");
    const data = [];
    items.forEach(li => {
      data.push({
        emoji: li.querySelector(".task-emoji") ? li.querySelector(".task-emoji").textContent : "",
        text: li.querySelector(".task-text").textContent,
        done: li.classList.contains("done")
      });
    });
    localStorage.setItem("tasks", JSON.stringify(data));
  }

  function renderTask(emoji, text, done) {
    const li = document.createElement("li");
    if (done) li.classList.add("done");

    const left = document.createElement("div");
    left.className = "task-left";
    left.onclick = function() {
      li.classList.toggle("done");
      saveTasks();
    };

    if (emoji) {
      const emojiSpan = document.createElement("span");
      emojiSpan.className = "task-emoji";
      emojiSpan.textContent = emoji;
      left.appendChild(emojiSpan);
    }

    const span = document.createElement("span");
    span.className = "task-text";
    span.textContent = text;
    left.appendChild(span);

    const del = document.createElement("button");
    del.textContent = "✕";
    del.className = "delete-btn";
    del.onclick = function() {
      li.remove();
      saveTasks();
    };

    li.appendChild(left);
    li.appendChild(del);
    document.getElementById("taskList").appendChild(li);
  }

  // Load saved tasks on startup
  tasks.forEach(t => renderTask(t.emoji, t.text, t.done));

  function selectEmoji(btn) {
    document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
    if (selectedEmoji === btn.textContent) {
      selectedEmoji = "";
    } else {
      btn.classList.add("selected");
      selectedEmoji = btn.textContent;
    }
  }

  function addTask() {
    const input = document.getElementById("taskInput");
    const text = input.value.trim();
    if (text === "") return;

    renderTask(selectedEmoji, text, false);
    saveTasks();

    input.value = "";
    input.focus();
  }

  document.getElementById("taskInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") addTask();
  });
</script>
  </body>
</html>

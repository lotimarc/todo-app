<!DOCTYPE html>
<html>
  <head>
    <title>Family To-Do List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      * { box-sizing: border-box; }

      body {
        background-image: url('background.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: Arial, sans-serif;
        padding: 20px;
        min-height: 100vh;
      }

      h1 {
        color: #2c3e7a;
        text-align: center;
        margin-bottom: 16px;
        font-size: 22px;
      }

      .tabs {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: center;
        margin-bottom: 16px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .tab {
        padding: 8px 14px;
        border-radius: 20px;
        border: 2px solid #2c3e7a;
        background: white;
        color: #2c3e7a;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .tab.active {
        background: #2c3e7a;
        color: white;
      }

      .card {
        max-width: 500px;
        margin: 0 auto;
        background-color: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      }

      .input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      input[type="text"] {
        flex: 1;
        padding: 10px 14px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
      }

      input[type="date"] {
        width: 100%;
        padding: 8px 12px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 10px;
        color: #444;
      }

      button {
        padding: 10px 18px;
        background-color: #2c3e7a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover { background-color: #1a2a5e; }

      .emoji-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .emoji-btn {
        background: #f0f4ff;
        border: 2px solid transparent;
        border-radius: 8px;
        font-size: 20px;
        padding: 4px 8px;
        cursor: pointer;
      }

      .emoji-btn.selected {
        border-color: #2c3e7a;
        background: #e0e8ff;
      }

      ul { list-style: none; padding: 0; margin: 0; }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
        gap: 10px;
      }

      li.done .task-text {
        text-decoration: line-through;
        color: #aaa;
      }

      li.done .due-date { color: #ccc; }

      .task-left {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        flex: 1;
      }

      .task-info { display: flex; flex-direction: column; }

      .task-text { font-size: 15px; color: #222; }

      .due-date {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }

      .due-date.overdue { color: #cc3333; font-weight: bold; }

      .task-emoji { font-size: 20px; }

      .delete-btn {
        background: none;
        color: #cc3333;
        font-size: 18px;
        padding: 0 8px;
      }

      .delete-btn:hover { background: none; color: #991111; }

      .empty {
        text-align: center;
        color: #aaa;
        font-size: 14px;
        padding: 24px 0;
      }
    </style>
  </head>
  <body>
    <h1>👨‍👩‍👧‍👦 Family To-Do List</h1>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('Loti', this)">Loti</button>
      <button class="tab" onclick="switchTab('Asline', this)">Asline</button>
      <button class="tab" onclick="switchTab('Hanah', this)">Hanah</button>
      <button class="tab" onclick="switchTab('Elizabeth', this)">Elizabeth</button>
      <button class="tab" onclick="switchTab('Melchi', this)">Melchi</button>
    </div>

    <div class="card">
      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button onclick="addTask()">Add</button>
      </div>
      <input type="date" id="dueDateInput">
      <div class="emoji-row">
        <button class="emoji-btn" onclick="selectEmoji(this)">📞</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">🏥</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">🏠</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">💼</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">🛒</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">📚</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">💪</button>
        <button class="emoji-btn" onclick="selectEmoji(this)">✈️</button>
      </div>
      <ul id="taskList"></ul>
      <div class="empty" id="emptyMsg" style="display:none">No tasks yet — add one above!</div>
    </div>

    <script>
      let currentMember = "Loti";
      // Ask for notification permission
function requestNotificationPermission() {
  if ("Notification" in window) {
    Notification.requestPermission();
  }
}

// Check for tasks due tomorrow and notify
function checkDueTomorrow() {
  if (Notification.permission !== "granted") return;

  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const tomorrowStr = tomorrow.toISOString().split("T")[0];

  const members = ["Loti", "Asline", "Hanah", "Elizabeth", "Melchi"];
  members.forEach(member => {
    const tasks = loadTasks(member);
    tasks.forEach(task => {
      if (task.date === tomorrowStr && !task.done) {
        new Notification("📋 Task due tomorrow!", {
          body: `${member}: ${task.emoji} ${task.text}`,
          icon: "https://lotimarc.github.io/todo-app/background.jpg"
        });
      }
    });
  });
}

// Run check every hour
requestNotificationPermission();
checkDueTomorrow();
setInterval(checkDueTomorrow, 60 * 60 * 1000);
      let selectedEmoji = "";

      function switchTab(name, btn) {
        currentMember = name;
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        selectedEmoji = "";
        document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
        renderList();
      }

      function selectEmoji(btn) {
        document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
        if (selectedEmoji === btn.textContent) {
          selectedEmoji = "";
        } else {
          btn.classList.add("selected");
          selectedEmoji = btn.textContent;
        }
      }

      function saveTasks(member, data) {
        localStorage.setItem("tasks_" + member, JSON.stringify(data));
      }

      function loadTasks(member) {
        return JSON.parse(localStorage.getItem("tasks_" + member) || "[]");
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        const [y, m, d] = dateStr.split("-");
        return `Due: ${m}/${d}/${y}`;
      }

      function isOverdue(dateStr) {
        if (!dateStr) return false;
        return new Date(dateStr) < new Date(new Date().toDateString());
      }

      function renderList() {
        const ul = document.getElementById("taskList");
        const empty = document.getElementById("emptyMsg");
        ul.innerHTML = "";
        const tasks = loadTasks(currentMember);
        if (tasks.length === 0) { empty.style.display = "block"; return; }
        empty.style.display = "none";
        tasks.forEach((t, i) => renderTask(t.emoji, t.text, t.done, t.date, i));
      }

      function renderTask(emoji, text, done, date, index) {
        const ul = document.getElementById("taskList");
        const li = document.createElement("li");
        if (done) li.classList.add("done");

        const left = document.createElement("div");
        left.className = "task-left";
        left.onclick = function() {
          const tasks = loadTasks(currentMember);
          tasks[index].done = !tasks[index].done;
          saveTasks(currentMember, tasks);
          renderList();
        };

        if (emoji) {
          const emojiSpan = document.createElement("span");
          emojiSpan.className = "task-emoji";
          emojiSpan.textContent = emoji;
          left.appendChild(emojiSpan);
        }

        const info = document.createElement("div");
        info.className = "task-info";

        const span = document.createElement("span");
        span.className = "task-text";
        span.textContent = text;
        info.appendChild(span);

        if (date) {
          const dateSpan = document.createElement("span");
          dateSpan.className = "due-date" + (isOverdue(date) && !done ? " overdue" : "");
          dateSpan.textContent = formatDate(date);
          info.appendChild(dateSpan);
        }

        left.appendChild(info);

        const del = document.createElement("button");
        del.textContent = "✕";
        del.className = "delete-btn";
        del.onclick = function() {
          const tasks = loadTasks(currentMember);
          tasks.splice(index, 1);
          saveTasks(currentMember, tasks);
          renderList();
        };

        li.appendChild(left);
        li.appendChild(del);
        ul.appendChild(li);
      }

      function addTask() {
        const input = document.getElementById("taskInput");
        const dateInput = document.getElementById("dueDateInput");
        const text = input.value.trim();
        if (text === "") return;

        const tasks = loadTasks(currentMember);
        tasks.push({ emoji: selectedEmoji, text, done: false, date: dateInput.value });
        saveTasks(currentMember, tasks);
        renderList();

        input.value = "";
        dateInput.value = "";
        selectedEmoji = "";
        document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
        input.focus();
      }

      document.getElementById("taskInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") addTask();
      });

      renderList();
    </script>
  </body>
</html>

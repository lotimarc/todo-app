<!DOCTYPE html>
<html>
  <head>
    <title>Family To-Do List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      * { box-sizing: border-box; }

      body {
        background-image: url('background.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: Arial, sans-serif;
        padding: 20px;
        min-height: 100vh;
      }

      h1 {
        color: #2c3e7a;
        text-align: center;
        margin-bottom: 16px;
        font-size: 22px;
      }

      /* LOGIN SCREEN */
      .login-card {
        max-width: 380px;
        margin: 60px auto 0;
        background-color: rgba(255, 255, 255, 0.90);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 36px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      .login-card h2 {
        color: #2c3e7a;
        margin-bottom: 8px;
        font-size: 22px;
      }

      .login-card p {
        color: #888;
        font-size: 14px;
        margin-bottom: 24px;
      }

      .login-card input {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 12px;
      }

      .login-card button {
        width: 100%;
        padding: 12px;
        background-color: #2c3e7a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
      }

      .login-card button:hover { background-color: #1a2a5e; }

      .error-msg {
        color: #cc3333;
        font-size: 13px;
        margin-top: 10px;
        min-height: 18px;
      }

      /* MAIN APP */
      .app-screen { display: none; }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 500px;
        margin: 0 auto 12px;
      }

      .welcome {
        color: #2c3e7a;
        font-weight: bold;
        font-size: 15px;
        background: rgba(255,255,255,0.85);
        padding: 6px 14px;
        border-radius: 20px;
      }

      .logout-btn {
        padding: 6px 14px;
        background: rgba(255,255,255,0.85);
        color: #cc3333;
        border: none;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
      }

      .card {
        max-width: 500px;
        margin: 0 auto;
        background-color: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      }

      .card h1 { margin-top: 0; margin-bottom: 16px; }

      .input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      input[type="text"] {
        flex: 1;
        padding: 10px 14px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
      }

      input[type="date"] {
        width: 100%;
        padding: 8px 12px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 10px;
        color: #444;
      }

      button {
        padding: 10px 18px;
        background-color: #2c3e7a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover { background-color: #1a2a5e; }

      .emoji-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .emoji-btn {
        background: #f0f4ff;
        border: 2px solid transparent;
        border-radius: 8px;
        font-size: 20px;
        padding: 4px 8px;
        cursor: pointer;
      }

      .emoji-btn.selected {
        border-color: #2c3e7a;
        background: #e0e8ff;
      }

      ul { list-style: none; padding: 0; margin: 0; }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 0;
        border-bottom: 1px solid #eee;
        gap: 10px;
      }

      li.done .task-text {
        text-decoration: line-through;
        color: #aaa;
      }

      li.done .due-date { color: #ccc; }

      .task-left {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        flex: 1;
      }

      .task-info { display: flex; flex-direction: column; }
      .task-text { font-size: 15px; color: #222; }

      .due-date {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }

      .due-date.overdue { color: #cc3333; font-weight: bold; }
      .task-emoji { font-size: 20px; }

      .delete-btn {
        background: none;
        color: #cc3333;
        font-size: 18px;
        padding: 0 8px;
      }

      .delete-btn:hover { background: none; color: #991111; }

      .empty {
        text-align: center;
        color: #aaa;
        font-size: 14px;
        padding: 24px 0;
      }

      .syncing {
        text-align: center;
        font-size: 12px;
        color: #888;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
      <div class="login-card">
        <div style="font-size:48px;margin-bottom:8px">👨‍👩‍👧‍👦</div>
        <h2>Family To-Do List</h2>
        <p>Sign in to see your tasks</p>
        <input type="email" id="emailInput" placeholder="Your email">
        <input type="password" id="passwordInput" placeholder="Your password">
        <button onclick="loginUser()">Sign In</button>
        <div class="error-msg" id="errorMsg"></div>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="appScreen" class="app-screen">
      <div class="top-bar">
        <span class="welcome" id="welcomeMsg">👋 Welcome!</span>
        <button class="logout-btn" onclick="logoutUser()">Sign Out</button>
      </div>
      <div class="card">
        <h1 style="text-align:center">👨‍👩‍👧‍👦 My Tasks</h1>
        <div class="input-row">
          <input type="text" id="taskInput" placeholder="Add a new task...">
          <button onclick="addTask()">Add</button>
        </div>
        <input type="date" id="dueDateInput">
        <div class="emoji-row">
          <button class="emoji-btn" onclick="selectEmoji(this)">📞</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">🏥</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">🏠</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">💼</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">🛒</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">📚</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">💪</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">✈️</button>
        </div>
        <ul id="taskList"></ul>
        <div class="empty" id="emptyMsg" style="display:none">No tasks yet — add one above!</div>
        <div class="syncing" id="syncMsg"></div>
      </div>
    </div>

    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDGW3cYbZxFkrEcSoS4DGGFfYn98ZHWkY8",
    authDomain: "family-todo-1e7c8.firebaseapp.com",
    projectId: "family-todo-1e7c8",
    storageBucket: "family-todo-1e7c8.firebasestorage.app",
    messagingSenderId: "111686009018",
    appId: "1:111686009018:web:096d2d837641ee8ed68283"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const messaging = getMessaging(app);

  const VAPID_KEY = "BHQwfClJ2vN8YRIShmbxnp_Mv7WKa4Qqc-GxTNWiXL6YuxB6sUvSlBKZtwDf1U_n6D--20V1TntlWWBIqJx5aeQ";

  let selectedEmoji = "";
  let unsubscribe = null;
  let currentUser = null;

  const nameMap = {
    "loti@family.com": "Loti",
    "asline@family.com": "Asline",
    "hanah@family.com": "Hanah",
    "elizabeth@family.com": "Elizabeth",
    "melchi@family.com": "Melchi"
  };

  // Register service worker and request notification permission
  async function setupNotifications() {
    if (!("Notification" in window) || !("serviceWorker" in navigator)) return;

    try {
      const permission = await Notification.requestPermission();
      if (permission !== "granted") return;

      const reg = await navigator.serviceWorker.register('/todo-app/firebase-messaging-sw.js');
      const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });

      if (token && currentUser) {
        // Save token to Firestore so we can send notifications later
        await addDoc(collection(db, "tokens"), {
          uid: currentUser.uid,
          token,
          email: currentUser.email,
          updatedAt: Date.now()
        });
      }

      // Handle foreground notifications
      onMessage(messaging, payload => {
        const { title, body } = payload.notification;
        new Notification(title, { body, icon: '/todo-app/background.jpg' });
      });

    } catch (e) {
      console.log("Notification setup:", e.message);
    }
  }

  // Check tasks due tomorrow and show notification
  function checkDueTomorrow(tasks, name) {
    if (Notification.permission !== "granted") return;
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const tomorrowStr = tomorrow.toISOString().split("T")[0];

    tasks.forEach(task => {
      if (task.date === tomorrowStr && !task.done) {
        new Notification("📋 Task due tomorrow!", {
          body: `${name}: ${task.emoji} ${task.text}`,
          icon: '/todo-app/background.jpg'
        });
      }
    });
  }

  // AUTH STATE
  onAuthStateChanged(auth, user => {
    if (user) {
      currentUser = user;
      const name = nameMap[user.email] || user.email;
      document.getElementById("welcomeMsg").textContent = `👋 Hi, ${name}!`;
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("appScreen").style.display = "block";
      listenToTasks(user.uid, name);
      setupNotifications();
    } else {
      currentUser = null;
      document.getElementById("loginScreen").style.display = "block";
      document.getElementById("appScreen").style.display = "none";
      if (unsubscribe) unsubscribe();
    }
  });

  // LOGIN
  window.loginUser = async function() {
    const email = document.getElementById("emailInput").value.trim();
    const password = document.getElementById("passwordInput").value;
    const errorMsg = document.getElementById("errorMsg");
    errorMsg.textContent = "";
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (e) {
      errorMsg.textContent = "Wrong email or password. Try again.";
    }
  };

  // LOGOUT
  window.logoutUser = async function() {
    await signOut(auth);
  };

  // EMOJI
  window.selectEmoji = function(btn) {
    document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
    if (selectedEmoji === btn.textContent) {
      selectedEmoji = "";
    } else {
      btn.classList.add("selected");
      selectedEmoji = btn.textContent;
    }
  };

  function formatDate(dateStr) {
    if (!dateStr) return "";
    const [y, m, d] = dateStr.split("-");
    return `Due: ${m}/${d}/${y}`;
  }

  function isOverdue(dateStr) {
    if (!dateStr) return false;
    return new Date(dateStr) < new Date(new Date().toDateString());
  }

  function renderList(tasks, name) {
    const ul = document.getElementById("taskList");
    const empty = document.getElementById("emptyMsg");
    ul.innerHTML = "";
    if (tasks.length === 0) { empty.style.display = "block"; return; }
    empty.style.display = "none";
    tasks.forEach(t => renderTask(t));
    checkDueTomorrow(tasks, name);
  }

  function renderTask(t) {
    const ul = document.getElementById("taskList");
    const li = document.createElement("li");
    if (t.done) li.classList.add("done");

    const left = document.createElement("div");
    left.className = "task-left";
    left.onclick = async function() {
      await updateDoc(doc(db, "tasks", t.id), { done: !t.done });
    };

    if (t.emoji) {
      const emojiSpan = document.createElement("span");
      emojiSpan.className = "task-emoji";
      emojiSpan.textContent = t.emoji;
      left.appendChild(emojiSpan);
    }

    const info = document.createElement("div");
    info.className = "task-info";

    const span = document.createElement("span");
    span.className = "task-text";
    span.textContent = t.text;
    info.appendChild(span);

    if (t.date) {
      const dateSpan = document.createElement("span");
      dateSpan.className = "due-date" + (isOverdue(t.date) && !t.done ? " overdue" : "");
      dateSpan.textContent = formatDate(t.date);
      info.appendChild(dateSpan);
    }

    left.appendChild(info);

    const del = document.createElement("button");
    del.textContent = "✕";
    del.className = "delete-btn";
    del.onclick = async function() {
      await deleteDoc(doc(db, "tasks", t.id));
    };

    li.appendChild(left);
    li.appendChild(del);
    ul.appendChild(li);
  }

  function listenToTasks(uid, name) {
    if (unsubscribe) unsubscribe();
    document.getElementById("syncMsg").textContent = "Syncing...";

    const q = query(
      collection(db, "tasks"),
      where("uid", "==", uid),
      orderBy("createdAt", "asc")
    );

    unsubscribe = onSnapshot(q, snapshot => {
      const tasks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderList(tasks, name);
      document.getElementById("syncMsg").textContent = "✓ Synced";
      setTimeout(() => document.getElementById("syncMsg").textContent = "", 2000);
    });
  }

  window.addTask = async function() {
    const input = document.getElementById("taskInput");
    const dateInput = document.getElementById("dueDateInput");
    const text = input.value.trim();
    if (!text || !currentUser) return;

    await addDoc(collection(db, "tasks"), {
      uid: currentUser.uid,
      emoji: selectedEmoji,
      text,
      done: false,
      date: dateInput.value,
      createdAt: Date.now()
    });

    input.value = "";
    dateInput.value = "";
    selectedEmoji = "";
    document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
    input.focus();
  };

  document.getElementById("taskInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") window.addTask();
  });

  document.getElementById("passwordInput").addEventListener("keypress", function(e) {
    if (e.key === "Enter") window.loginUser();
  });
</script>

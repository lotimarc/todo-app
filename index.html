<!DOCTYPE html>
<html>
  <head>
    <title>Family To-Do List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      * { box-sizing: border-box; }

      body {
        background-image: url('background.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: Arial, sans-serif;
        padding: 20px;
        min-height: 100vh;
      }

      /* LOGIN SCREEN */
      .login-card {
        max-width: 380px;
        margin: 60px auto 0;
        background-color: rgba(255, 255, 255, 0.90);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 36px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      .login-card h2 { color: #2c3e7a; margin-bottom: 8px; font-size: 22px; }
      .login-card p { color: #888; font-size: 14px; margin-bottom: 24px; }

      .login-card input {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 12px;
      }

      .login-card button {
        width: 100%;
        padding: 12px;
        background-color: #2c3e7a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
      }

      .login-card button:hover { background-color: #1a2a5e; }
      .error-msg { color: #cc3333; font-size: 13px; margin-top: 10px; min-height: 18px; }

      /* MAIN APP */
      .app-screen { display: none; }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 600px;
        margin: 0 auto 12px;
      }

      .welcome {
        color: #2c3e7a;
        font-weight: bold;
        font-size: 15px;
        background: rgba(255,255,255,0.85);
        padding: 6px 14px;
        border-radius: 20px;
      }

      .logout-btn {
        padding: 6px 14px;
        background: rgba(255,255,255,0.85);
        color: #cc3333;
        border: none;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
      }

      .card {
        max-width: 600px;
        margin: 0 auto;
        background-color: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      }

      .card h1 { margin-top: 0; margin-bottom: 16px; text-align: center; color: #2c3e7a; font-size: 22px; }

      .input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      input[type="text"] {
        flex: 1;
        padding: 10px 14px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
      }

      .bottom-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      input[type="date"] {
        flex: 1;
        padding: 8px 12px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        color: #444;
      }

      select {
        flex: 1;
        padding: 8px 12px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        color: #444;
        background: white;
      }

      button {
        padding: 10px 18px;
        background-color: #2c3e7a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover { background-color: #1a2a5e; }

      .emoji-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .emoji-btn {
        background: #f0f4ff;
        border: 2px solid transparent;
        border-radius: 8px;
        font-size: 20px;
        padding: 4px 8px;
        cursor: pointer;
      }

      .emoji-btn.selected { border-color: #2c3e7a; background: #e0e8ff; }

      /* MEMBER SECTIONS */
      .member-section { margin-bottom: 20px; }

      .member-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 8px;
        font-weight: bold;
        font-size: 14px;
      }

      .member-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      ul { list-style: none; padding: 0; margin: 0; }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
        gap: 10px;
      }

      li.done .task-text { text-decoration: line-through; color: #aaa; }
      li.done .due-date { color: #ccc; }

      .task-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
      }

      .task-left.editable { cursor: pointer; }

      .task-info { display: flex; flex-direction: column; }
      .task-text { font-size: 14px; color: #222; }

      .due-date { font-size: 12px; color: #888; margin-top: 2px; }
      .due-date.overdue { color: #cc3333; font-weight: bold; }
      .task-emoji { font-size: 18px; }

      .assigned-tag {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: bold;
        white-space: nowrap;
      }

      .delete-btn {
        background: none;
        color: #cc3333;
        font-size: 16px;
        padding: 0 6px;
      }

      .delete-btn:hover { background: none; color: #991111; }

      .empty-member {
        font-size: 13px;
        color: #bbb;
        padding: 6px 0;
        font-style: italic;
      }

      .due-banner {
        background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        color: white;
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 16px;
        font-size: 14px;
        font-weight: bold;
      }

      .due-banner-item {
        font-weight: normal;
        padding: 4px 0;
        border-top: 1px solid rgba(255,255,255,0.3);
      }

      .syncing { text-align: center; font-size: 12px; color: #888; margin-top: 8px; }

      .divider {
        border: none;
        border-top: 1.5px solid #e0e0e0;
        margin: 16px 0;
      }
      .task-note {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
  font-style: italic;
  line-height: 1.4;
}

.expand-btn {
  background: none;
  border: none;
  color: #aaa;
  font-size: 16px;
  padding: 0 4px;
  cursor: pointer;
  line-height: 1;
}

.expand-btn:hover { color: #666; background: none; }

.recur-badge {
  font-size: 11px;
  color: #4a6cf7;
  background: #e8f0fe;
  padding: 2px 7px;
  border-radius: 10px;
  margin-top: 3px;
  display: inline-block;
}
    </style>
  </head>
  <body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">
      <div class="login-card">
       <img src="loti-profile.jpg" style="width:90px;height:90px;border-radius:50%;object-fit:cover;margin-bottom:12px;border:3px solid #2c3e7a;">
        <h2>Family To-Do List</h2>
        <p>Sign in to see your tasks</p>
        <input type="email" id="emailInput" placeholder="Your email">
        <input type="password" id="passwordInput" placeholder="Your password">
        <button onclick="loginUser()">Sign In</button>
        <div class="error-msg" id="errorMsg"></div>
      </div>
    </div>

    <!-- MAIN APP -->
    <div id="appScreen" class="app-screen">
      <div class="top-bar">
        <span class="welcome" id="welcomeMsg">
  <img id="profilePic" src="loti-profile.jpg" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;display:none;">
  👋 Welcome!
</span>
        <button class="logout-btn" onclick="logoutUser()">Sign Out</button>
      </div>
      <div class="card">
        <h1>👨‍👩‍👧‍👦 Family Tasks</h1>

        <!-- ADD TASK -->
        <div class="input-row">
          <input type="text" id="taskInput" placeholder="Add a new task...">
          <button onclick="addTask()">Add</button>
        </div>
        <div class="bottom-row">
  <input type="date" id="dueDateInput">
  <select id="assignSelect">
    <option value="">Assign to...</option>
    <option value="Loti">Loti</option>
    <option value="Asline">Asline</option>
    <option value="Hanah">Hanah</option>
    <option value="Elizabeth">Elizabeth</option>
    <option value="Melchi">Melchi</option>
  </select>
</div>
<textarea id="taskNotes" placeholder="Add a note (optional)..." style="width:100%;padding:8px 12px;border:1.5px solid #ccc;border-radius:8px;font-size:14px;font-family:Arial,sans-serif;resize:none;height:60px;margin-bottom:10px;color:#444;"></textarea>
<select id="recurSelect" style="width:100%;padding:8px 12px;border:1.5px solid #ccc;border-radius:8px;font-size:14px;color:#444;background:white;margin-bottom:10px;">
  <option value="">No repeat</option>
  <option value="daily">🔁 Repeat daily</option>
  <option value="weekly">🔁 Repeat weekly</option>
  <option value="monthly">🔁 Repeat monthly</option>
</select>
        <div class="emoji-row">
          <button class="emoji-btn" onclick="selectEmoji(this)">📞</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">🏥</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">🏠</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">💼</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">🛒</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">📚</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">💪</button>
          <button class="emoji-btn" onclick="selectEmoji(this)">✈️</button>
        </div>

        <hr class="divider">

        <!-- DUE TOMORROW BANNER -->
        <div id="dueBanner"></div>

        <!-- TASK LIST BY MEMBER -->
        <div id="allTasks"></div>

        <div class="syncing" id="syncMsg"></div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
      import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
      import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDGW3cYbZxFkrEcSoS4DGGFfYn98ZHWkY8",
        authDomain: "family-todo-1e7c8.firebaseapp.com",
        projectId: "family-todo-1e7c8",
        storageBucket: "family-todo-1e7c8.firebasestorage.app",
        messagingSenderId: "111686009018",
        appId: "1:111686009018:web:096d2d837641ee8ed68283"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      const members = ["Loti", "Asline", "Hanah", "Elizabeth", "Melchi"];

      const memberColors = {
        "Loti":      { bg: "#e8f0fe", dot: "#4a6cf7", tag: "#4a6cf7" },
        "Asline":    { bg: "#fce8f3", dot: "#e91e8c", tag: "#e91e8c" },
        "Hanah":     { bg: "#e8faf0", dot: "#1e9e56", tag: "#1e9e56" },
        "Elizabeth": { bg: "#fff8e8", dot: "#f0a500", tag: "#f0a500" },
        "Melchi":    { bg: "#f3e8fe", dot: "#9c27b0", tag: "#9c27b0" }
      };

      const nameMap = {
        "loti@family.com": "Loti",
        "asline@family.com": "Asline",
        "hanah@family.com": "Hanah",
        "elizabeth@family.com": "Elizabeth",
        "melchi@family.com": "Melchi"
      };

      let selectedEmoji = "";
      let unsubscribe = null;
      let currentUser = null;
      let currentName = "";
      let allTasks = [];

      // AUTH
      onAuthStateChanged(auth, user => {
        if (user) {
          currentUser = user;
          currentName = nameMap[user.email] || user.email;
          document.getElementById("welcomeMsg").innerHTML = `<img src="loti-profile.jpg" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;"> 👋 Hi, ${currentName}!`;
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("appScreen").style.display = "block";

          // Pre-select assign to self
          document.getElementById("assignSelect").value = currentName;

          listenToTasks();
        } else {
          currentUser = null;
          currentName = "";
          document.getElementById("loginScreen").style.display = "block";
          document.getElementById("appScreen").style.display = "none";
          if (unsubscribe) unsubscribe();
        }
      });

      // LOGIN
      window.loginUser = async function() {
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.textContent = "";
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (e) {
          errorMsg.textContent = "Wrong email or password. Try again.";
        }
      };

      // LOGOUT
      window.logoutUser = async function() { await signOut(auth); };

      // EMOJI
      window.selectEmoji = function(btn) {
        document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
        if (selectedEmoji === btn.textContent) {
          selectedEmoji = "";
        } else {
          btn.classList.add("selected");
          selectedEmoji = btn.textContent;
        }
      };

      function formatDate(dateStr) {
        if (!dateStr) return "";
        const [y, m, d] = dateStr.split("-");
        return `Due: ${m}/${d}/${y}`;
      }

      function isOverdue(dateStr) {
        if (!dateStr) return false;
        return new Date(dateStr) < new Date(new Date().toDateString());
      }

      function isTomorrow(dateStr) {
        if (!dateStr) return false;
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        return dateStr === tomorrow.toISOString().split("T")[0];
      }

      function renderAll(tasks) {
        // Due tomorrow banner
        const bannerDiv = document.getElementById("dueBanner");
        bannerDiv.innerHTML = "";
        const dueTomorrow = tasks.filter(t => isTomorrow(t.date) && !t.done);
        if (dueTomorrow.length > 0) {
          const banner = document.createElement("div");
          banner.className = "due-banner";
          const title = document.createElement("div");
          title.style.marginBottom = "8px";
          title.textContent = `⏰ Due tomorrow (${dueTomorrow.length} task${dueTomorrow.length > 1 ? 's' : ''})`;
          banner.appendChild(title);
          dueTomorrow.forEach(task => {
            const item = document.createElement("div");
            item.className = "due-banner-item";
            item.textContent = `${task.emoji} ${task.text}${task.assignedTo ? ' — ' + task.assignedTo : ''}`;
            banner.appendChild(item);
          });
          bannerDiv.appendChild(banner);
        }

        // Render tasks grouped by member
        const container = document.getElementById("allTasks");
        container.innerHTML = "";

        members.forEach(member => {
          const memberTasks = tasks.filter(t => t.assignedTo === member);
          const colors = memberColors[member];

          const section = document.createElement("div");
          section.className = "member-section";

          const header = document.createElement("div");
          header.className = "member-header";
          header.style.background = colors.bg;
          header.innerHTML = `<div class="member-dot" style="background:${colors.dot}"></div><span style="color:${colors.dot}">${member}</span><span style="color:#aaa;font-weight:normal;font-size:12px">${memberTasks.filter(t=>!t.done).length} open</span>`;
          section.appendChild(header);

          const ul = document.createElement("ul");

          if (memberTasks.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-member";
            empty.textContent = "No tasks yet";
            section.appendChild(empty);
          } else {
            memberTasks.forEach(t => {
              const isOwner = t.uid === currentUser.uid;
              const li = document.createElement("li");
              if (t.done) li.classList.add("done");

              const left = document.createElement("div");
              left.className = "task-left" + (isOwner ? " editable" : "");
              if (isOwner) {
                left.onclick = async function() {
  if (!t.done && t.recur) {
    // Calculate next due date
    const nextDate = new Date(t.date || new Date());
    if (t.recur === "daily") nextDate.setDate(nextDate.getDate() + 1);
    if (t.recur === "weekly") nextDate.setDate(nextDate.getDate() + 7);
    if (t.recur === "monthly") nextDate.setMonth(nextDate.getMonth() + 1);
    const nextStr = nextDate.toISOString().split("T")[0];
    await updateDoc(doc(db, "tasks", t.id), {
      done: false,
      date: nextStr,
      createdAt: Date.now()
    });
  } else {
    await updateDoc(doc(db, "tasks", t.id), { done: !t.done });
  }
};

              if (t.emoji) {
                const emojiSpan = document.createElement("span");
                emojiSpan.className = "task-emoji";
                emojiSpan.textContent = t.emoji;
                left.appendChild(emojiSpan);
              }

              const info = document.createElement("div");
              info.className = "task-info";

              const span = document.createElement("span");
              span.className = "task-text";
              span.textContent = t.text;
              info.appendChild(span);

              if (t.date) {
                const dateSpan = document.createElement("span");
                dateSpan.className = "due-date" + (isOverdue(t.date) && !t.done ? " overdue" : "");
                dateSpan.textContent = formatDate(t.date);
                info.appendChild(dateSpan);
              }

              // Show who assigned it if not the owner
              if (t.assignedBy && t.assignedBy !== t.assignedTo) {
  const assignedBy = document.createElement("span");
  assignedBy.style.cssText = "font-size:11px;color:#aaa;margin-top:2px;";
  assignedBy.textContent = `Assigned by ${t.assignedBy}`;
  info.appendChild(assignedBy);
}

if (t.recur) {
  const recurBadge = document.createElement("span");
  recurBadge.className = "recur-badge";
  recurBadge.textContent = `🔁 Repeats ${t.recur}`;
  info.appendChild(recurBadge);
}

if (t.notes) {
  const noteEl = document.createElement("div");
  noteEl.className = "task-note";
  noteEl.style.display = "none";
  noteEl.textContent = `📝 ${t.notes}`;
  noteEl.id = `note-${t.id}`;
  info.appendChild(noteEl);

  const expandBtn = document.createElement("button");
  expandBtn.className = "expand-btn";
  expandBtn.textContent = "▾";
  expandBtn.title = "Show note";
  expandBtn.onclick = function(e) {
    e.stopPropagation();
    const note = document.getElementById(`note-${t.id}`);
    const isHidden = note.style.display === "none";
    note.style.display = isHidden ? "block" : "none";
    expandBtn.textContent = isHidden ? "▴" : "▾";
  };
  info.appendChild(expandBtn);
}

              left.appendChild(info);

              const right = document.createElement("div");
              right.style.display = "flex";
              right.style.alignItems = "center";
              right.style.gap = "6px";

              if (isOwner) {
                const del = document.createElement("button");
                del.textContent = "✕";
                del.className = "delete-btn";
                del.onclick = async function() {
                  await deleteDoc(doc(db, "tasks", t.id));
                };
                right.appendChild(del);
              }

              li.appendChild(left);
              li.appendChild(right);
              ul.appendChild(li);
            });
            section.appendChild(ul);
          }

          container.appendChild(section);
        });

        document.getElementById("syncMsg").textContent = "✓ Synced";
        setTimeout(() => document.getElementById("syncMsg").textContent = "", 2000);
      }

      function listenToTasks() {
        if (unsubscribe) unsubscribe();
        document.getElementById("syncMsg").textContent = "Syncing...";

        const q = query(collection(db, "tasks"), orderBy("createdAt", "asc"));

        unsubscribe = onSnapshot(q, snapshot => {
          allTasks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          renderAll(allTasks);
        });
      }

      window.addTask = async function() {
        const input = document.getElementById("taskInput");
        const dateInput = document.getElementById("dueDateInput");
        const assignSelect = document.getElementById("assignSelect");
        const text = input.value.trim();
        if (!text || !currentUser) return;

        const assignedTo = assignSelect.value || currentName;

        const notes = document.getElementById("taskNotes").value.trim();
const recur = document.getElementById("recurSelect").value;
await addDoc(collection(db, "tasks"), {
  uid: currentUser.uid,
  assignedTo,
  assignedBy: currentName,
  emoji: selectedEmoji,
  text,
  notes,
  recur,
  done: false,
  date: dateInput.value,
  createdAt: Date.now()
});

        input.value = "";
        dateInput.value = "";
        assignSelect.value = currentName;
       document.getElementById("recurSelect").value = "";
        selectedEmoji = "";
        document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
        input.focus();
      };

      document.getElementById("taskInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") window.addTask();
      });

      document.getElementById("passwordInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") window.loginUser();
      });
    </script>
  </body>
</html>

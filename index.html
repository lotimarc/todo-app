<!DOCTYPE html>
<html>
  <head>
    <title>Family To-Do List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      * { box-sizing: border-box; }
      body.dark {
  --bg: #1a1a2e;
  --card: rgba(30, 30, 50, 0.92);
  --text: #e0e0e0;
  --subtext: #aaa;
  --border: #444;
  --input-bg: #2a2a40;
  --row-bg: #22223a;
  --empty: #666;
}

body:not(.dark) {
  --bg: transparent;
  --card: rgba(255, 255, 255, 0.85);
  --text: #222;
  --subtext: #888;
  --border: #eee;
  --input-bg: white;
  --row-bg: #f8f9ff;
  --empty: #bbb;
}

      body {
        background-image: url('background.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: Arial, sans-serif;
        padding: 20px;
        min-height: 100vh;
      }

      /* LOGIN SCREEN */
      .login-card {
        max-width: 380px;
        margin: 60px auto 0;
        background-color: rgba(255, 255, 255, 0.90);
        backdrop-filter: blur(10px);
        border-radius: 16px;
        padding: 36px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      .login-card h2 { color: #2c3e7a; margin-bottom: 8px; font-size: 22px; }
      .login-card p { color: #888; font-size: 14px; margin-bottom: 24px; }

      .login-card input {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        margin-bottom: 12px;
      }

      .login-card button {
        width: 100%;
        padding: 12px;
        background-color: #2c3e7a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        font-weight: bold;
      }

      .login-card button:hover { background-color: #1a2a5e; }
      .error-msg { color: #cc3333; font-size: 13px; margin-top: 10px; min-height: 18px; }

      /* MAIN APP */
      .app-screen { display: none; }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 600px;
        margin: 0 auto 12px;
        
      }

      .welcome {
        color: #2c3e7a;
        font-weight: bold;
        font-size: 15px;
        background: rgba(255,255,255,0.85);
        padding: 6px 14px;
        border-radius: 20px;
      }

      .badge {
  display: inline-block;
  background: #1e9e56;
  color: white;
  font-size: 11px;
  font-weight: bold;
  padding: 2px 7px;
  border-radius: 20px;
  margin-left: 6px;
  vertical-align: middle;
}

      .logout-btn {
        padding: 6px 14px;
        background: rgba(255,255,255,0.85);
        color: #cc3333;
        border: none;
        border-radius: 20px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
      }

      .card {
        max-width: 600px;
        margin: 0 auto;
        background-color: var(--card);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
      }

      input[type="text"],
      input[type="date"],
      input[type="email"],
      input[type="password"],
      select,
      textarea {
        background: var(--input-bg);
        color: var(--text);
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
        gap: 10px;
      }

      .task-text {font-size: 14px; color: var(--text);}
      .due-date { font-size: 12px; color: var(--subtext); margin-top: 2px; }
      .empty-member { font-size: 13px; color: var(--empty); padding: 6px 0; font-style:italic; }
      .leaderboard-row { background: var(--row-bar);}
      .chart-bar-wrap { background: #f0f0f0; border-radius: 6px; height: 10px; width: 100%; overflow: hidden;}

      .card h1 { margin-top: 0; margin-bottom: 16px; text-align: center; color: #2c3e7a; font-size: 22px; }

      .input-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      input[type="text"] {
        flex: 1;
        padding: 10px 14px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
      }

      .bottom-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }

      input[type="date"] {
        flex: 1;
        padding: 8px 12px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        color: #444;
      }

      select {
        flex: 1;
        padding: 8px 12px;
        border: 1.5px solid #ccc;
        border-radius: 8px;
        font-size: 14px;
        color: #444;
        background: white;
      }

      button {
        padding: 10px 18px;
        background-color: #2c3e7a;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
      }

      button:hover { background-color: #1a2a5e; }

      .emoji-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .emoji-btn {
        background: #f0f4ff;
        border: 2px solid transparent;
        border-radius: 8px;
        font-size: 20px;
        padding: 4px 8px;
        cursor: pointer;
      }

      .emoji-btn.selected { border-color: #2c3e7a; background: #e0e8ff; }

      /* MEMBER SECTIONS */
      .member-section { margin-bottom: 20px; }

      .member-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: 8px;
        margin-bottom: 8px;
        font-weight: bold;
        font-size: 14px;
      }

      .member-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      ul { list-style: none; padding: 0; margin: 0; }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
        gap: 10px;
      }

      li.done .task-text { text-decoration: line-through; color: #aaa; }
      li.done .due-date { color: #ccc; }

      .task-left {
        display: flex;
        align-items: center;
        gap: 10px;
        flex: 1;
      }

      .task-left.editable { cursor: pointer; }

      .task-info { display: flex; flex-direction: column; }
      .task-text { font-size: 14px; color: #222; }

      .due-date { font-size: 12px; color: #888; margin-top: 2px; }
      .due-date.overdue { color: #cc3333; font-weight: bold; }
      .task-emoji { font-size: 18px; }

      .assigned-tag {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: bold;
        white-space: nowrap;
      }

      .delete-btn {
        background: none;
        color: #cc3333;
        font-size: 16px;
        padding: 0 6px;
      }

      .delete-btn:hover { background: none; color: #991111; }

      .empty-member {
        font-size: 13px;
        color: #bbb;
        padding: 6px 0;
        font-style: italic;
      }

      .due-banner {
        background: linear-gradient(135deg, #ff6b6b, #ee5a24);
        color: white;
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 16px;
        font-size: 14px;
        font-weight: bold;
      }

      .due-banner-item {
        font-weight: normal;
        padding: 4px 0;
        border-top: 1px solid rgba(255,255,255,0.3);
      }

      .syncing { text-align: center; font-size: 12px; color: #888; margin-top: 8px; }

      .divider {
        border: none;
        border-top: 1.5px solid #e0e0e0;
        margin: 16px 0;
      }
      .task-note {
  font-size: 12px;
  color: #888;
  margin-top: 4px;
  font-style: italic;
  line-height: 1.4;
}

.expand-btn {
  background: none;
  border: none;
  color: #aaa;
  font-size: 16px;
  padding: 0 4px;
  cursor: pointer;
  line-height: 1;
}

.expand-btn:hover { color: #666; background: none; }

.recur-badge {
  font-size: 11px;
  color: #4a6cf7;
  background: #e8f0fe;
  padding: 2px 7px;
  border-radius: 10px;
  margin-top: 3px;
  display: inline-block;
}
.dashboard-btn {

  background: rgba(255,255,255,0.85);
  border: none;
  border-radius: 20px;
  font-size: 16px;
  cursor: pointer;
}

.dark-btn {
  padding: 6px 12px;
  background: rgba(255,255,255,0.85);
  border: none;
  border-radius: 20px;
  font-size: 16px;
  cursor: pointer;
}

.chart-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.chart-name {
  width: 70px;
  font-size: 13px;
  font-weight: bold;
  text-align: right;
  flex-shrink: 0;
}

.chart-bars {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.chart-bar-wrap {
  background: #f0f0f0;
  border-radius: 6px;
  height: 10px;
  width: 100%;
  overflow: hidden;
}

.chart-bar-fill {
  height: 10px;
  border-radius: 6px;
  transition: width 0.6s ease;
}

.chart-stats {
  font-size: 11px;
  color: #888;
  white-space: nowrap;
  flex-shrink: 0;
  width: 70px;
}

.leaderboard-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 8px;
  background: #f8f9ff;
}

.leaderboard-rank {
  font-size: 22px;
  width: 32px;
  text-align: center;
  flex-shrink: 0;
}

.leaderboard-name {
  flex: 1;
  font-size: 14px;
  font-weight: bold;
}

.leaderboard-points {
  font-size: 13px;
  font-weight: bold;
  color: #2c3e7a;
  background: #e8f0fe;
  padding: 4px 10px;
  border-radius: 20px;
}

.leaderboard-tasks {
  font-size: 11px;
  color: #aaa;
  margin-top: 2px;
}

.leaderboard-row.first {
  background: linear-gradient(135deg, #fff8e0, #ffeaa0);
  border: 1.5px solid #f0c040;
}
    </style>
  </head>

    <script type="module">

      import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
      import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDGW3cYbZxFkrEcSoS4DGGFfYn98ZHWkY8",
        authDomain: "family-todo-1e7c8.firebaseapp.com",
        projectId: "family-todo-1e7c8",
        storageBucket: "family-todo-1e7c8.firebasestorage.app",
        messagingSenderId: "111686009018",
        appId: "1:111686009018:web:096d2d837641ee8ed68283"
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const auth = getAuth(app);

      const members = ["Loti", "Asline", "Hanah", "Elizabeth", "Melchi"];

      const memberColors = {
        "Loti":      { bg: "#e8f0fe", dot: "#4a6cf7", tag: "#4a6cf7" },
        "Asline":    { bg: "#fce8f3", dot: "#e91e8c", tag: "#e91e8c" },
        "Hanah":     { bg: "#e8faf0", dot: "#1e9e56", tag: "#1e9e56" },
        "Elizabeth": { bg: "#fff8e8", dot: "#f0a500", tag: "#f0a500" },
        "Melchi":    { bg: "#f3e8fe", dot: "#9c27b0", tag: "#9c27b0" }
      };

      const nameMap = {
        "loti@family.com": "Loti",
        "asline@family.com": "Asline",
        "hanah@family.com": "Hanah",
        "elizabeth@family.com": "Elizabeth",
        "melchi@family.com": "Melchi"
      };

      const photoMap = {
  "Loti": "loti-profile.jpg",
  "Asline": "asline-profile.jpg",
  "Hanah": "hanah-profile.jpg",
  "Elizabeth": "elizabeth-profile.jpg",
  "Melchi": "melchi-profile.jpg"
};

      let selectedEmoji = "";

      // Dark mode
const savedDark = localStorage.getItem("darkMode") === "true";
if (savedDark) {
  document.body.classList.add("dark");
  document.getElementById("darkBtn") && (document.getElementById("darkBtn").textContent = "☀️");
}

function launchConfetti() {
  const colors = ["#ff6b6b", "#4a6cf7", "#1e9e56", "#f0a500", "#9c27b0", "#00bcd4"];
  const container = document.body;
  for (let i = 0; i < 60; i++) {
    const confetti = document.createElement("div");
    confetti.style.cssText = `
      position: fixed;
      width: ${Math.random() * 10 + 6}px;
      height: ${Math.random() * 10 + 6}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      border-radius: ${Math.random() > 0.5 ? "50%" : "2px"};
      left: ${Math.random() * 100}vw;
      top: -20px;
      opacity: 1;
      z-index: 9999;
      pointer-events: none;
      transition: top ${Math.random() * 1.5 + 1}s ease, opacity 0.5s ease ${Math.random() * 1.5 + 0.5}s;
    `;
    container.appendChild(confetti);
    setTimeout(() => {
      confetti.style.top = `${Math.random() * 60 + 40}vh`;
      confetti.style.opacity = "0";
    }, 50);
    setTimeout(() => confetti.remove(), 2500);
  }
}

window.toggleDark = function() {
  const isDark = document.body.classList.toggle("dark");
  document.getElementById("darkBtn").textContent = isDark ? "☀️" : "🌙";
  localStorage.setItem("darkMode", isDark);
};

      // AUTH
      onAuthStateChanged(auth, user => {
        if (user) {
          currentUser = user;
          currentName = nameMap[user.email] || user.email;
          const photo = photoMap[currentName] || "loti-profile.jpg";
document.getElementById("welcomeMsg").innerHTML = `<img src="${photo}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;"> 👋 Hi, ${currentName}!`;
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("appScreen").style.display = "block";

          // Pre-select assign to self
          document.getElementById("assignSelect").value = currentName;

          window.toggleDashboard = function() {
  const dash = document.getElementById("dashboard");
  dash.style.display = dash.style.display === "none" ? "block" : "none";
  if (dash.style.display === "block") renderDashboard();
};

function renderDashboard() {
  // --- CHART ---
  const container = document.getElementById("chartContainer");
  container.innerHTML = "";

  const maxTotal = Math.max(...members.map(m => {
    const memberTasks = allTasks.filter(t => t.assignedTo === m);
    return memberTasks.length || 1;
  }));

  members.forEach(member => {
    const memberTasks = allTasks.filter(t => t.assignedTo === member);
    const done = memberTasks.filter(t => t.done).length;
    const open = memberTasks.filter(t => !t.done).length;
    const total = memberTasks.length;
    const colors = memberColors[member];

    const row = document.createElement("div");
    row.className = "chart-row";

    const name = document.createElement("div");
    name.className = "chart-name";
    name.style.color = colors.dot;
    name.textContent = member;

    const bars = document.createElement("div");
    bars.className = "chart-bars";

    const doneWrap = document.createElement("div");
    doneWrap.className = "chart-bar-wrap";
    const doneFill = document.createElement("div");
    doneFill.className = "chart-bar-fill";
    doneFill.style.background = colors.dot;
    doneFill.style.width = "0%";
    doneWrap.appendChild(doneFill);
    bars.appendChild(doneWrap);

    const openWrap = document.createElement("div");
    openWrap.className = "chart-bar-wrap";
    const openFill = document.createElement("div");
    openFill.className = "chart-bar-fill";
    openFill.style.background = "#ddd";
    openFill.style.width = "0%";
    openWrap.appendChild(openFill);
    bars.appendChild(openWrap);

    const stats = document.createElement("div");
    stats.className = "chart-stats";
    stats.innerHTML = `✅ ${done} done<br>📋 ${open} open`;

    row.appendChild(name);
    row.appendChild(bars);
    row.appendChild(stats);
    container.appendChild(row);

    setTimeout(() => {
      doneFill.style.width = total > 0 ? Math.round(done / maxTotal * 100) + "%" : "0%";
      openFill.style.width = total > 0 ? Math.round(open / maxTotal * 100) + "%" : "0%";
    }, 50);
  });

  // --- LEADERBOARD ---
  const leaderboard = document.getElementById("leaderboard");
  leaderboard.innerHTML = "";

  const medals = ["🥇", "🥈", "🥉", "4️⃣", "5️⃣"];

  const scores = members.map(member => {
    const memberTasks = allTasks.filter(t => t.assignedTo === member);
    const doneTasks = memberTasks.filter(t => t.done);
    const points = doneTasks.reduce((sum, t) => sum + (t.recur ? 15 : 10), 0);
    return { member, points, done: doneTasks.length };
  });

  scores.sort((a, b) => b.points - a.points);

  scores.forEach((s, i) => {
    const colors = memberColors[s.member];
    const row = document.createElement("div");
    row.className = "leaderboard-row" + (i === 0 && s.points > 0 ? " first" : "");

    const rank = document.createElement("div");
    rank.className = "leaderboard-rank";
    rank.textContent = medals[i];

    const avatar = document.createElement("img");
avatar.src = photoMap[s.member];
avatar.style.cssText = "width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0;";

    const info = document.createElement("div");
    info.style.flex = "1";

    const name = document.createElement("div");
    name.className = "leaderboard-name";
    name.style.color = colors.dot;
    name.textContent = s.member;

    const tasks = document.createElement("div");
    tasks.className = "leaderboard-tasks";
    tasks.textContent = `${s.done} task${s.done !== 1 ? 's' : ''} completed`;

    info.appendChild(name);
    info.appendChild(tasks);

    const pts = document.createElement("div");
    pts.className = "leaderboard-points";
    pts.textContent = `${s.points} pts`;

    row.appendChild(rank);
    row.appendChild(avatar);
    row.appendChild(info);
    row.appendChild(pts);
    leaderboard.appendChild(row);
  });
}
          listenToTasks();
        } else {
          currentUser = null;
          currentName = "";
          document.getElementById("loginScreen").style.display = "block";
          document.getElementById("appScreen").style.display = "none";
          if (unsubscribe) unsubscribe();
        }
      });
    

      // LOGIN
      window.loginUser = async function() {
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        const errorMsg = document.getElementById("errorMsg");
        errorMsg.textContent = "";
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (e) {
          errorMsg.textContent = "Wrong email or password. Try again.";
        }
      };

      // LOGOUT
      window.logoutUser = async function() { await signOut(auth); };

      // EMOJI
      window.selectEmoji = function(btn) {
        document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
        if (selectedEmoji === btn.textContent) {
          selectedEmoji = "";
        } else {
          btn.classList.add("selected");
          selectedEmoji = btn.textContent;
        }
      };

      function formatDate(dateStr) {
        if (!dateStr) return "";
        const [y, m, d] = dateStr.split("-");
        return `Due: ${m}/${d}/${y}`;
      }

      function isOverdue(dateStr) {
        if (!dateStr) return false;
        return new Date(dateStr) < new Date(new Date().toDateString());
      }

      function isTomorrow(dateStr) {
        if (!dateStr) return false;
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        return dateStr === tomorrow.toISOString().split("T")[0];
      }

      function renderAll(tasks) {
        // Due tomorrow banner
        const bannerDiv = document.getElementById("dueBanner");
        bannerDiv.innerHTML = "";
        const dueTomorrow = tasks.filter(t => isTomorrow(t.date) && !t.done);
        if (dueTomorrow.length > 0) {
          const banner = document.createElement("div");
          banner.className = "due-banner";
          const title = document.createElement("div");
          title.style.marginBottom = "8px";
          title.textContent = `⏰ Due tomorrow (${dueTomorrow.length} task${dueTomorrow.length > 1 ? 's' : ''})`;
          banner.appendChild(title);
          dueTomorrow.forEach(task => {
            const item = document.createElement("div");
            item.className = "due-banner-item";
            item.textContent = `${task.emoji} ${task.text}${task.assignedTo ? ' — ' + task.assignedTo : ''}`;
            banner.appendChild(item);
          });
          bannerDiv.appendChild(banner);
        }

        // Render tasks grouped by member
        const container = document.getElementById("allTasks");
        container.innerHTML = "";

        members.forEach(member => {
          const memberTasks = tasks.filter(t => t.assignedTo === member);
          const colors = memberColors[member];

          const section = document.createElement("div");
          section.className = "member-section";

          const header = document.createElement("div");
          header.className = "member-header";
          header.style.background = colors.bg;
          header.innerHTML = `<img src="${photoMap[member]}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;border:1.5px solid ${colors.dot}"><span style="color:${colors.dot}">${member}</span><span style="color:#aaa;font-weight:normal;font-size:12px">${memberTasks.filter(t=>!t.done).length} open</span>`;
          section.appendChild(header);

          const ul = document.createElement("ul");

          if (memberTasks.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-member";
            empty.textContent = "No tasks yet";
            section.appendChild(empty);
          } else {
            memberTasks.forEach(t => {
              const isOwner = t.uid === currentUser.uid;
              const li = document.createElement("li");
              if (t.done) li.classList.add("done");

              const left = document.createElement("div");
              left.className = "task-left" + (isOwner ? " editable" : "");
              if (isOwner) {
                left.onclick = async function() {
  if (!t.done && t.recur) {
    const nextDate = new Date(t.date || new Date());
    if (t.recur === "daily") nextDate.setDate(nextDate.getDate() + 1);
    if (t.recur === "weekly") nextDate.setDate(nextDate.getDate() + 7);
    if (t.recur === "monthly") nextDate.setMonth(nextDate.getMonth() + 1);
    const nextStr = nextDate.toISOString().split("T")[0];
    await updateDoc(doc(db, "tasks", t.id), {
      done: false,
      date: nextStr,
      createdAt: Date.now()
    });
  } else {
    await updateDoc(doc(db, "tasks", t.id), { done: !t.done });
if (!t.done) launchConfetti();
  }
};
              }

              if (t.emoji) {
                const emojiSpan = document.createElement("span");
                emojiSpan.className = "task-emoji";
                emojiSpan.textContent = t.emoji;
                left.appendChild(emojiSpan);
              }

              const info = document.createElement("div");
              info.className = "task-info";

              const span = document.createElement("span");
              span.className = "task-text";
              span.textContent = t.text;
              info.appendChild(span);

              if (t.date) {
                const dateSpan = document.createElement("span");
                dateSpan.className = "due-date" + (isOverdue(t.date) && !t.done ? " overdue" : "");
                dateSpan.textContent = formatDate(t.date);
                info.appendChild(dateSpan);
              }

              // Show who assigned it if not the owner
              if (t.assignedBy && t.assignedBy !== t.assignedTo) {
  const assignedBy = document.createElement("span");
  assignedBy.style.cssText = "font-size:11px;color:#aaa;margin-top:2px;";
  assignedBy.textContent = `Assigned by ${t.assignedBy}`;
  info.appendChild(assignedBy);
}

if (t.recur) {
  const recurBadge = document.createElement("span");
  recurBadge.className = "recur-badge";
  recurBadge.textContent = `🔁 Repeats ${t.recur}`;
  info.appendChild(recurBadge);
}

if (t.notes) {
  const noteEl = document.createElement("div");
  noteEl.className = "task-note";
  noteEl.style.display = "none";
  noteEl.textContent = `📝 ${t.notes}`;
  noteEl.id = `note-${t.id}`;
  info.appendChild(noteEl);

  const expandBtn = document.createElement("button");
  expandBtn.className = "expand-btn";
  expandBtn.textContent = "▾";
  expandBtn.title = "Show note";
  expandBtn.onclick = function(e) {
    e.stopPropagation();
    const note = document.getElementById(`note-${t.id}`);
    const isHidden = note.style.display === "none";
    note.style.display = isHidden ? "block" : "none";
    expandBtn.textContent = isHidden ? "▴" : "▾";
  };
  info.appendChild(expandBtn);
}

              left.appendChild(info);

              const right = document.createElement("div");
              right.style.display = "flex";
              right.style.alignItems = "center";
              right.style.gap = "6px";

              if (isOwner) {
                const del = document.createElement("button");
                del.textContent = "✕";
                del.className = "delete-btn";
                del.onclick = async function() {
                  await deleteDoc(doc(db, "tasks", t.id));
                };
                right.appendChild(del);
              }

              li.appendChild(left);
              li.appendChild(right);
              ul.appendChild(li);
            });
            section.appendChild(ul);
          }

          container.appendChild(section);
        });

        // Weekly task counter badge
const startOfWeek = new Date();
startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
startOfWeek.setHours(0, 0, 0, 0);

const myUid = currentUser.uid;
const completedThisWeek = tasks.filter(t =>
  t.uid === myUid &&
  t.done &&
  t.createdAt >= startOfWeek.getTime()
).length;

const existingBadge = document.getElementById("weekBadge");
if (existingBadge) existingBadge.remove();

if (completedThisWeek > 0) {
  const badge = document.createElement("span");
  badge.id = "weekBadge";
  badge.className = "badge";
  badge.textContent = `✅ ${completedThisWeek} this week`;
  document.getElementById("welcomeMsg").appendChild(badge);
}
        document.getElementById("syncMsg").textContent = "✓ Synced";
        setTimeout(() => document.getElementById("syncMsg").textContent = "", 2000);
      }

      function listenToTasks() {
        if (unsubscribe) unsubscribe();
        document.getElementById("syncMsg").textContent = "Syncing...";

        const q = query(collection(db, "tasks"), orderBy("createdAt", "asc"));

        unsubscribe = onSnapshot(q, snapshot => {
          allTasks = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
          renderAll(allTasks);
        });
      }

      window.addTask = async function() {
        const input = document.getElementById("taskInput");
        const dateInput = document.getElementById("dueDateInput");
        const assignSelect = document.getElementById("assignSelect");
        const text = input.value.trim();
        if (!text || !currentUser) return;

        const assignedTo = assignSelect.value || currentName;

        const notes = document.getElementById("taskNotes").value.trim();
const recur = document.getElementById("recurSelect").value;
await addDoc(collection(db, "tasks"), {
  uid: currentUser.uid,
  assignedTo,
  assignedBy: currentName,
  emoji: selectedEmoji,
  text,
  notes,
  recur,
  done: false,
  date: dateInput.value,
  createdAt: Date.now()
});

        input.value = "";
        dateInput.value = "";
        assignSelect.value = currentName;
       document.getElementById("recurSelect").value = "";
        selectedEmoji = "";
        document.querySelectorAll(".emoji-btn").forEach(b => b.classList.remove("selected"));
        input.focus();
      };

      document.getElementById("taskInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") window.addTask();
      });

      document.getElementById("passwordInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") window.loginUser();
      });
    </script>
  </body>
</html>
